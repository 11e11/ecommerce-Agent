name: Source quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: pip install -e ".[mcp,xlsx]" -r tests/requirements.txt
      - name: Run source tests
        run: python -m pytest
