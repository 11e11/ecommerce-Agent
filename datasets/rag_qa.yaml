  gold_chapter: a-operators__a5-inventory
  gold_constraint: amazon.ipi.score.min_400
  answer: "当前阈值 400 分；低于阈值会被限制 FBA 仓储容量，需从售罄率等维度改善。"
  source: "ontology:amazon.ipi.score.min_400 (src/a-operators/a5-inventory.md#38-ipi-score-改善方案)"

- id: inv-002
  category: 库存
  question: "Stranded Inventory（ stranded ASIN 库存）的管理目标是什么？"
  gold_chapter: a-operators__a5-inventory
  gold_constraint: amazon.fba.inventory.stranded_target_zero
  answer: "目标为 0 个 ASIN，它是最容易修复的 IPI 扣分项。"
  source: "ontology:amazon.fba.inventory.stranded_target_zero (src/a-operators/a5-inventory.md#12-amazon-fba-库存关键指标)"

- id: inv-003
  category: 库存
  question: "计算实际可用库存时，公式是什么？忽略在途库存会有什么后果？"
  gold_chapter: a-operators__a5-inventory
  gold_constraint: inventory.in_transit_inventory.available_stock_formula
  answer: "实际可用库存 = 当前库存 + 在途库存；忽略在途会低估可支撑天数，导致过度补货或误判断货。"
  source: "ontology:inventory.in_transit_inventory.available_stock_formula (src/a-operators/a5-inventory.md#31-补货决策分析)"

- id: inv-004
  category: 库存
  question: "同时做 Amazon FBA 和 Shopify 独立站时，怎么防止同一批库存超卖？"
  gold_chapter: a-operators__a5-inventory
  gold_constraints:
    - inventory.warehouse.multi_channel_pool
    - inventory.fbm_inventory.multi_channel_pool
  answer: "由库存中心系统（总库存池）统一协调 FBA 仓、自建仓、3PL 仓；自发货库存也必须纳入总库存池同步管理。"
  source: "ontology:inventory.warehouse.multi_channel_pool / inventory.fbm_inventory.multi_channel_pool (src/a-operators/a5-inventory.md#62-多渠道库存同步)"

- id: inv-005
  category: 库存
  question: "只有一个供应商，风险大吗？应该怎么做？"
  gold_chapter: a-operators__a5-inventory
  gold_constraint: inventory.supplier.backup_required
  answer: "单一供应商风险极高，一旦出问题就断货；必须建立备选供应商并追踪历史交期数据（春节/国庆前后产能大幅下降）。"
  source: "ontology:inventory.supplier.backup_required (src/a-operators/a5-inventory.md#37-供应商交期风险评估)"

- id: inv-006
  category: 库存
  question: "补货量不是供应商 MOQ 的整数倍时怎么处理？"
  gold_chapter: a-operators__a5-inventory
  gold_constraint: inventory.moq.order_rounding
  answer: "补货量需向上取整到 MOQ 的倍数，MOQ 随供应商评估一并收集。"
  source: "ontology:inventory.moq.order_rounding (src/a-operators/a5-inventory.md#37-供应商交期风险评估)"

- id: inv-007
  category: 库存
  question: "BFCM（黑五网一）大促备货需要提前多久发货？"
  gold_chapter: a-operators__a5-inventory
  gold_constraint: amazon.bfcm.prep_lead_time
  answer: "需提前 6-8 周发货，是一个 8 周的系统化过程；FBA 入仓在大促前 2 周左右完成。"
  source: "ontology:amazon.bfcm.prep_lead_time (src/a-operators/a5-inventory.md#34-大促备货策略prime-day--bfcm)"

- id: inv-008
