# RAG evaluation QA set — Commerce Agent OS knowledge corpus.
#
# Coverage: 商品 (listing/pricing/advertising/product research), 库存
# (inventory/FBA/replenishment), 平台规则 (platform rules/compliance/IP).
#
# Gold standard conventions:
#   gold_chapter   — chapter id from dist/knowledge/index.json (required)
#   gold_heading   — optional substring the relevant chunk's heading must
#                    contain (use only when confident)
#   gold_constraint— optional ontology constraint id; the packaged constraint
#                    chunk also counts as relevant
#   answer / source— the fact and its provenance (constraint id or chapter
#                    section) so every number stays traceable, matching the
#                    repo's content-gate culture.
#
# Cases whose gold matches no chunk at all are flagged "gold_unverified" in
# the eval report instead of silently dragging metrics down.

